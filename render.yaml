services:
  - type: web
    name: smart-campus
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm --prefix backend run prisma:migrate:deploy && npm --prefix backend run seed:admin && npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-campus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 60d
      - key: REFRESH_TOKEN_COOKIE_NAME
        value: smart-campus-refresh
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      - key: CORS_ORIGIN
        value: "*"
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST_PATH
        value: "../frontend/dist"
      - key: TRUST_PROXY
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "4000"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Smart Campus <no-reply@smartcampuss.online>"

databases:
  - name: smart-campus-db
    plan: free
    databaseName: smart_campus

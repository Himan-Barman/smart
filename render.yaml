services:
  - type: web
    name: smart-campus
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm --prefix backend run prisma:migrate:deploy && npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-campus-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CORS_ORIGIN
        value: "*"
      - key: SERVE_FRONTEND
        value: "true"
      - key: FRONTEND_DIST_PATH
        value: "../frontend/dist"
      - key: TRUST_PROXY
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "4000"

databases:
  - name: smart-campus-db
    plan: free
    databaseName: smart_campus
